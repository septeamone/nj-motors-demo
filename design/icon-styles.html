<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NJ Motors — 10 стилей иконок</title>
<style>
:root{--bg:#040c14;--panel:#0b1c2d;--line:rgba(220,196,172,.24);--ink:#f3e8d6;--ink2:#d4bfa5;--cream:#f3e8d6;--navy:#040c14;--red:#d40404}
[data-theme="light"]{--bg:#efe5d3;--panel:#f6eedf;--line:rgba(4,12,20,.28);--ink:#040c14;--ink2:#2a3340;--cream:#040c14;--navy:#efe5d3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;padding:clamp(18px,4vw,56px)}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:18px}
h1{font:900 clamp(30px,5vw,60px)/1 "Arial Black",Impact,sans-serif;text-transform:uppercase}
h1 small{display:block;font:600 13px system-ui;letter-spacing:.18em;color:var(--ink2);margin-bottom:8px}
button.tool{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:10px 16px;font:700 13px system-ui;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.note{color:var(--ink2);max-width:80ch;margin:18px 0 6px}
.style{display:grid;grid-template-columns:230px 1fr;gap:0;border-top:1px solid var(--line);margin-top:0}
.style:first-of-type{margin-top:18px}
.meta{padding:22px 18px 22px 0}
.meta b{display:block;font:900 44px/1 "Arial Black",Impact,sans-serif;color:transparent;-webkit-text-stroke:1.5px var(--ink2)}
.meta h2{font:800 17px/1.2 system-ui;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.meta p{font-size:14px;color:var(--ink2)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px 6px;padding:22px 0}
.ic{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink2)}
.ic svg{width:72px;height:72px;overflow:visible}
/* shared base */
svg.i{fill:none;stroke:var(--cream);stroke-width:2.25;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:6}
svg.i .r{fill:var(--red);stroke:none}
svg.i .f{fill:var(--cream);stroke:none}
/* 1 offset plate (the current set) */
/* 2 flat plate, no offset */
.s2 svg.i .r{transform:none!important}
/* 3 bold, round */
.s3 svg.i{stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
/* 4 hairline, no plate, red only in dots */
.s4 svg.i{stroke-width:1.4;stroke-linecap:butt}
.s4 svg.i .r{display:none}
.s4 svg.i .f{fill:var(--red)}
/* 5 badge: red disc behind cream lines */
.s5 .ic .b{width:72px;height:72px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.s5 .ic .b svg{width:44px;height:44px}
.s5 svg.i{stroke:#f3e8d6;stroke-width:2.6}.s5 svg.i .r{display:none}.s5 svg.i .f{fill:#f3e8d6}
/* 6 rubber stamp: all red ink, framed, tilted */
.s6 .ic .b{width:72px;height:72px;border:3px solid var(--red);outline:1.5px solid var(--red);outline-offset:-8px;display:grid;place-items:center;transform:rotate(-4deg)}
.s6 .ic .b svg{width:46px;height:46px}
.s6 svg.i{stroke:var(--red);stroke-width:2.6}.s6 svg.i .r{display:none}.s6 svg.i .f{fill:var(--red)}
/* 7 double line: outline of the outline */
.s7 svg.i{stroke-width:6;stroke:var(--cream)}
.s7 svg.i *{vector-effect:none}
.s7 svg.i .r{fill:var(--red)}
.s7 .ic .b{position:relative}
/* 8 solid duotone: red body, thin cream outline */
.s8 svg.i{stroke-width:1.8}
.s8 svg.i .r{transform:none!important;opacity:.95}
/* 9 perforated: dashed line + offset plate */
.s9 svg.i{stroke-dasharray:4.5 3.2;stroke-linecap:butt}
.s9 svg.i .r{transform:translate(3px,3px)!important}
/* 10 tile: cream card, navy line, red plate */
.s10 .ic .b{width:72px;height:72px;background:var(--cream);display:grid;place-items:center;box-shadow:5px 5px 0 var(--red)}
.s10 .ic .b svg{width:48px;height:48px}
.s10 svg.i{stroke:#040c14}.s10 svg.i .f{fill:#040c14}.s10 svg.i .r{transform:none!important}
@media(max-width:720px){.style{grid-template-columns:1fr}.meta{padding-bottom:0}}
</style></head><body>
<header><h1><small>NJ MOTORS · 10 СТИЛЕЙ ИКОНОК</small>Выберите язык иконок</h1><button class="tool" id="theme">Светлая тема</button></header>
<p class="note">Одни и те же 12 иконок (маршрут, судно, автовоз, порт, автомобиль, осмотр, фото, договор, рубль, гарантия, телефон, ключи) в десяти манерах. Скажите номер, и я сделаю полный набор в выбранной манере и вставлю его на сайт.</p>

const PICK=["route","ship","truck","port","car","inspect","camera","contract","rub","shield","phone","key"];
const all={};Object.values(ICONS).forEach(g=>g.forEach(i=>all[i[0]]=i));
const STYLES=[

const root=document.getElementById('root');
STYLES.forEach(([name,desc],k)=>{
  const n=k+1;const sec=document.createElement('section');sec.className='style s'+n;
  const wrap=[5,6,10].includes(n);
  sec.innerHTML=`<div class="meta"><b>${String(n).padStart(2,'0')}</b><h2>${name}</h2><p>${desc}</p></div><div class="row">${PICK.map(id=>{const i=all[id];const svg=`<svg viewBox="0 0 48 48" class="i" role="img" aria-label="${i[1]}">${i[3]}</svg>`;return `<div class="ic">${wrap?`<span class="b">${svg}</span>`:svg}<span>${i[1]}</span></div>`}).join('')}</div>`;
  root.appendChild(sec);
});
document.getElementById('theme').onclick=e=>{const l=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=l?'light':'dark';e.currentTarget.textContent=l?'Тёмная тема':'Светлая тема'};
</script></body></html>
